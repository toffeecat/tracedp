[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lh_platform"
version = "0.2.0"
description = "Unified Long-Horizon Agent Experiment Platform"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.6.0",
    "pypdf>=6.0.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
analysis = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]
dev = [
    "lh-platform[analysis]",
    "pyarrow>=15.0",
    "pytest>=8.0",
    "ruff==0.15.18",
]
native-tracing = [
    "litellm>=1.70.0",
    "spacy>=3.8.0,<4",
    "tiktoken>=0.9.0",
    "tqdm>=4.66.0",
]
agentic-rl = [
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "liger-kernel>=0.8.0",
    "peft>=0.15",
    "torch>=2.4",
    "transformers>=4.51",
]
flash-attn = [
    "flash-attn>=2.5",
]
blackwell-performance = [
    "flash-attn-4[cu13]==4.0.0b22",
    "liger-kernel==0.8.0",
]
appworld = [
    "appworld==0.2.0.dev0",
]
optimization = [
    # Pinned for Formal-v2 CP-SAT reproducibility (num_search_workers=1, seed=0).
    "ortools==9.15.6755",
]

[project.scripts]
lh-platform = "lh_platform.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["lh_platform*"]
exclude = ["scripts*", "tests*", "results*"]

[tool.setuptools.package-data]
"lh_platform.methods" = ["_inventory.yaml"]
"lh_platform.test_time_adaptation" = ["dover_official_analysis_source_contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Extend the repo-root Ruff config (ruff.toml) so the package shares one
# source of truth for formatting/lint. See ruff.toml for the full ruleset.
[tool.ruff]
extend = "../ruff.toml"
